    <!-- Fonts are pulled from Google Fonts via @import in src/index.css.
         Preconnect lets the DNS/TLS handshake happen in parallel with the
         CSS request so Inter starts downloading sooner on first paint.
         `crossorigin` is REQUIRED on fonts.gstatic.com — font binaries are
         fetched with CORS, so without it the preconnect is wasted. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Set the theme class before first paint to avoid a light→dark flash.
         First visit follows the OS setting; once the user toggles, their
         explicit choice in localStorage wins. Kept blocking + inline so it
         runs before any CSS applies. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
