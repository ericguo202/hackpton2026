x-api-base: &api-base
  image: ${API_IMAGE:?API_IMAGE must be set}
  restart: always
  env_file:
    - .env
  environment:
    POSTGRES_HOST: db
    POSTGRES_PORT: 5432
  expose:
    - "8000"
  depends_on:
    db:
      condition: service_healthy
  volumes:
    - ./models:/app/models:ro
  healthcheck:
    test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
    interval: 10s
    timeout: 5s
    start_period: 30s
    retries: 12

services:
  db:
    image: postgres:17
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-hpton}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-hpton}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api_blue:
    <<: *api-base
    container_name: backend-api-blue

  api_green:
    <<: *api-base
    container_name: backend-api-green

  migrate:
    image: ${API_IMAGE:?API_IMAGE must be set}
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./models:/app/models:ro
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    profiles:
      - tools

  # Dedicated worker that enforces the delivery-analytics retention ceiling
  # (delete stored webcam summaries within 12 months of a user's last session).
  # Runs independently of api_blue/api_green so the promise holds even when the
  # API is down. Shares the same advisory-lock-guarded loop as the in-API
  # scheduler, so the two are safe to run together (single-flight + idempotent).
  retention_purge:
    image: ${API_IMAGE:?API_IMAGE must be set}
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # Worker process, not web/migrations: don't run migrations on boot (the
      # `migrate` service owns schema) and skip the API-oriented healthcheck.
      RUN_MIGRATIONS_ON_STARTUP: "0"
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "-m", "scripts.retention_worker"]
    healthcheck:
      disable: true

  caddy:
    image: caddy:2
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro,z
      - ./caddy/upstream:/etc/caddy/upstream:ro,z
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - db

volumes:
  pgdata:
  caddy_data:
  caddy_config:
