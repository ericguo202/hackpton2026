name: Backend Deploy

on:
  push:
    branches: [main]
    paths:
      - "backend/**"

env:
  REGISTRY: ghcr.io

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        shell: bash
        run: |
          image="${REGISTRY}/${GITHUB_REPOSITORY}-backend"
          echo "IMAGE_REF=${image,,}" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run backend tests
        working-directory: backend
        env:
          CLERK_JWT_ISSUER: https://example.clerk.accounts.dev
        run: pytest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_REF }}:${{ github.sha }}
            ${{ env.IMAGE_REF }}:main
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          IMAGE_REF: ${{ env.IMAGE_REF }}:${{ github.sha }}
          GHCR_USERNAME: ${{ secrets.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          PUBLIC_HEALTH_URL: https://tfpdo.space/api/v1/health
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,PUBLIC_HEALTH_URL
          script: |
            cd ~/hackpton2026/backend
            git fetch origin main
            git checkout main
            git pull --ff-only origin main
            chmod +x ops/deploy-blue-green.sh
            sudo --preserve-env=IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN,PUBLIC_HEALTH_URL ./ops/deploy-blue-green.sh
